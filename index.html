
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toon Fight Arena</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101525;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
 touch-action:none;
}
.screen{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#101525,#252b49);
 z-index:5;
 padding:20px;
}
h1{
 color:#ffb000;
 font-size:35px;
 text-align:center;
 text-shadow:0 0 15px #ff6a00;
}
button{
 background:#ff9500;
 color:#111;
 border:0;
 padding:13px 22px;
 border-radius:10px;
 font-weight:bold;
 font-size:16px;
 margin:6px;
}
button:active{transform:scale(.94)}
.characters{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:12px;
}
.character{
 background:#202b46;
 border:2px solid #ff9500;
 border-radius:12px;
 padding:18px;
 min-width:130px;
 text-align:center;
}
.character span{
 font-size:45px;
 display:block;
 margin-bottom:10px;
}
#game{
 display:none;
 height:100dvh;
 width:100vw;
 position:relative;
 background:linear-gradient(#151d38 0%,#34446b 65%,#25202b 65%);
}
#top{
 position:absolute;
 top:12px;
 width:100%;
 display:flex;
 justify-content:space-around;
 z-index:2;
}
.healthbox{width:40%;text-align:center}
.health{
 height:17px;
 background:#555;
 border:2px solid white;
 border-radius:20px;
 overflow:hidden;
}
.fill{
 height:100%;
 width:100%;
 background:#20e65c;
}
#arena{
 position:absolute;
 bottom:100px;
 width:100%;
 height:65%;
}
.fighter{
 position:absolute;
 bottom:0;
 font-size:75px;
 text-align:center;
 transition:left .12s;
}
#player{left:15%}
#enemy{right:15%}
.name{
 font-size:13px;
 font-weight:bold;
 color:#ffdb69;
}
#controls{
 position:absolute;
 bottom:15px;
 width:100%;
 display:flex;
 justify-content:space-around;
 align-items:center;
}
.control{
 background:#25334f;
 border:2px solid #ffb000;
 color:white;
 width:62px;
 height:62px;
 border-radius:50%;
 font-size:23px;
}
#message{
 position:absolute;
 top:30%;
 width:100%;
 text-align:center;
 font-size:30px;
 font-weight:bold;
 color:#ffcb43;
 z-index:3;
}
#restart{
 display:none;
 position:absolute;
 top:55%;
 left:50%;
 transform:translateX(-50%);
 z-index:4;
}
</style>
</head>

<body>

<div class="screen" id="menu">
<h1>⚔ TOON FIGHT ARENA</h1>
<p>CHOOSE YOUR FIGHTER</p>

<div class="characters">
<div class="character">
<span>🥷</span>
SHADOW
<button onclick="choose('SHADOW','🥷')">SELECT</button>
</div>

<div class="character">
<span>🦸</span>
TITAN
<button onclick="choose('TITAN','🦸')">SELECT</button>
</div>

<div class="character">
<span>⚡</span>
FLASH
<button onclick="choose('FLASH','⚡')">SELECT</button>
</div>

<div class="character">
<span>🔥</span>
BLAZE
<button onclick="choose('BLAZE','🔥')">SELECT</button>
</div>
</div>
<p>Choose your character to begin!</p>
</div>

<div id="game">

<div id="top">
<div class="healthbox">
<b id="pname">PLAYER</b>
<div class="health"><div class="fill" id="php"></div></div>
</div>
<div class="healthbox">
<b>CPU</b>
<div class="health"><div class="fill" id="ehp"></div></div>
</div>
</div>

<div id="message">FIGHT!</div>

<div id="arena">
<div class="fighter" id="player">
🥷
<div class="name">PLAYER</div>
</div>

<div class="fighter" id="enemy">
🤖
<div class="name">CPU</div>
</div>
</div>

<div id="controls">
<div>
<button class="control" id="left">◀</button>
<button class="control" id="right">▶</button>
</div>
<div>
<button class="control" id="block">🛡</button>
<button class="control" id="punch">👊</button>
<button class="control" id="kick">🦶</button>
</div>
</div>

<button id="restart" onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>
let playerHealth=100;
let enemyHealth=100;
let playerName="SHADOW";
let playerEmoji="🥷";
let playerX=15;
let enemyX=75;
let blocking=false;
let finished=false;
let attackLock=false;

const player=document.getElementById("player");
const enemy=document.getElementById("enemy");
const game=document.getElementById("game");

function choose(name,emoji){
 playerName=name;
 playerEmoji=emoji;

 document.getElementById("menu").style.display="none";
 game.style.display="block";

 document.getElementById("pname").textContent=name;
 player.innerHTML=emoji+'<div class="name">'+name+'</div>';
 startCPU();
}

function update(){
 player.style.left=playerX+"%";
 enemy.style.left=enemyX+"%";

 document.getElementById("php").style.width=playerHealth+"%";
 document.getElementById("ehp").style.width=enemyHealth+"%";

 document.getElementById("php").style.background=
 playerHealth<30?"red":"#20e65c";

 document.getElementById("ehp").style.background=
 enemyHealth<30?"red":"#20e65c";
}

function move(direction){
 if(finished)return;

 if(direction==="left")playerX=Math.max(0,playerX-4);
 if(direction==="right")playerX=Math.min(85,playerX+4);

 update();
}

function attack(type){
 if(finished || attackLock)return;

 attackLock=true;

 let distance=Math.abs(playerX-enemyX);

 if(distance<27){
 let damage=type==="kick"?15:10;
 enemyHealth=Math.max(0,enemyHealth-damage);

 document.getElementById("message").textContent=
 type==="kick"?"POWER KICK!":"PUNCH!";

 enemy.style.transform="translateX(12px)";
 setTimeout(()=>enemy.style.transform="none",150);
 }else{
 document.getElementById("message").textContent="TOO FAR!";
 }

 update();
 checkWinner();

 setTimeout(()=>{
 attackLock=false;
 if(!finished)document.getElementById("message").textContent="";
 },500);
}

function defend(){
 blocking=true;
 document.getElementById("message").textContent="BLOCKING!";
}

function stopDefend(){
 blocking=false;
 document.getElementById("message").textContent="";
}

function cpuAttack(){
 if(finished)return;

 let distance=Math.abs(playerX-enemyX);

 if(distance>25){
 enemyX=Math.max(playerX+12,enemyX-3);
 enemyX=Math.min(85,enemyX);
 update();
 return;
 }

 if(blocking){
 playerHealth=Math.max(0,playerHealth-3);
 document.getElementById("message").textContent="BLOCKED!";
 }else{
 playerHealth=Math.max(0,playerHealth-8);
 document.getElementById("message").textContent="CPU ATTACK!";
 }

 update();
 checkWinner();
}

let cpuTimer;

function startCPU(){
 cpuTimer=setInterval(cpuAttack,1400);
}

function checkWinner(){
 if(enemyHealth<=0){
 finish("🏆 YOU WIN!");
 }
 if(playerHealth<=0){
 finish("💀 CPU WINS!");
 }
}

function finish(message){
 finished=true;
 clearInterval(cpuTimer);
 document.getElementById("message").textContent=message;
 document.getElementById("restart").style.display="block";
}

function bindHold(id,action){
 const button=document.getElementById(id);

 button.addEventListener("pointerdown",e=>{
 e.preventDefault();
 action();
 });
}

bindHold("left",()=>move("left"));
bindHold("right",()=>move("right"));
bindHold("punch",()=>attack("punch"));
bindHold("kick",()=>attack("kick"));

document.getElementById("block").addEventListener("pointerdown",e=>{
 e.preventDefault();
 defend();
});

["pointerup","pointerleave","pointercancel"].forEach(event=>{
 document.getElementById("block").addEventListener(event,stopDefend);
});

document.addEventListener("keydown",e=>{
 if(e.repeat)return;
 if(e.key==="ArrowLeft")move("left");
 if(e.key==="ArrowRight")move("right");
 if(e.key===" ")attack("punch");
 if(e.key==="k")attack("kick");
});
</script>

</body>
</html>
